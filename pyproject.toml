[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dasch-sky-mosaic"
version = "0.1.0"
description = "Tools for solving plate WCS and building sky mosaics from DASCH photographic plate data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "astropy>=6.1",
  "astroalign>=2.5",
  "boto3>=1.26",
  "numpy>=2.0",
  "pillow>=10.0",
  "python-dotenv>=1.0",
  "reproject>=0.15",
  "requests>=2.32",
  "scipy>=1.11",
  "wwt-data-formats>=0.18",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]